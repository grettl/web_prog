<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин посуды</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="site-header">
        <div class="header-center">
            <img src="images/cups-logo.png.jpg" alt="Логотип магазина" class="header-logo">

            <h1>Магазин посуды</h1>
        </div>

        <button type="button" id="cart-toggle" onclick="toggleCart()">
            Корзина
        </button>
    </header>


    <main>

        <section>
            <h2>Наши товары</h2>
            <div id="products"></div>
        </section>
        <section id="cart">
            <button type="button" id="cart-close" onclick="toggleCart()">✕ Закрыть</button>
            <h2>Корзина</h2>
            <div id="cart-items">Корзина пуста</div>
            <button type="button" id="remove-selected" onclick="removeSelected()" disabled>
                Удалить
            </button>
            <p>Итого: <span id="cart-total">0</span> ₽</p>
            <button type="button" id="checkout-button" onclick="openOrderForm()" disabled>
                Оформить заказ
            </button>

        </section>
    </main>
    <div id="order-modal" class="modal">
        <div class="modal-content">
            <button type="button" class="modal-close" onclick="closeOrderForm()">×</button>

            <h2>Оформление заказа</h2>
            <div id="order-products"></div>
            <p id="order-total"></p>

            <form id="order-form">

                <input id="first-name" name="firstName" type="text" placeholder="Имя" pattern="[A-Za-zА-Яа-яЁё\- ]+"
                    title="Имя должно содержать только буквы" required>

                <input id="last-name" name="lastName" type="text" placeholder="Фамилия" pattern="[A-Za-zА-Яа-яЁё\- ]+"
                    title="Фамилия должна содержать только буквы" required>

                <input id="address" name="address" type="text" placeholder="Адрес" minlength="5" required>

                <div class="phone-block">
                    <label for="phone">Телефон</label>

                    <div class="phone-field">
                        <span class="phone-prefix">+7</span>

                        <input id="phone" name="phone" type="tel" placeholder="999 123 45 67" inputmode="numeric"
                            maxlength="13" pattern="[0-9]{3} [0-9]{3} [0-9]{2} [0-9]{2}" title="Введите номер полностью"
                            required>
                    </div>
                </div>
                <button type="submit">Подтвердить заказ</button>

            </form>
        </div>
    </div>
    <div id="success-modal" class="modal">
        <div class="success-content">
            <h2>Заказ создан!</h2>
            <p>Ваш заказ успешно оформлен. Спасибо за покупку.</p>

            <button type="button" onclick="closeSuccessModal()">
                Закрыть
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
